<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>저장소 카드 뉴스</title>
<style>
  :root {
    --bg: #0f1115;
    --surface: #171a21;
    --surface-hover: #1f2330;
    --border: #262b38;
    --text: #e8eaf0;
    --text-dim: #9aa1b2;
    --accent: #5b8def;
    --accent-soft: rgba(91, 141, 239, 0.15);
    --chip-bg: #232838;
    --shadow: rgba(0, 0, 0, 0.35);
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f5f6f9;
      --surface: #ffffff;
      --surface-hover: #ffffff;
      --border: #e4e7ee;
      --text: #1b1e27;
      --text-dim: #6b7280;
      --accent: #3865d6;
      --accent-soft: rgba(56, 101, 214, 0.1);
      --chip-bg: #eef1f8;
      --shadow: rgba(30, 40, 70, 0.12);
    }
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Pretendard", "Malgun Gothic", sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 32px 20px 60px;
  }

  header {
    max-width: 1160px;
    margin: 0 auto 8px;
  }

  header h1 {
    font-size: 1.7rem;
    margin: 0 0 6px;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  header p {
    color: var(--text-dim);
    margin: 0;
    font-size: 0.95rem;
  }

  .mock-banner {
    max-width: 1160px;
    margin: 18px auto 28px;
    padding: 10px 16px;
    background: var(--accent-soft);
    border: 1px solid var(--accent);
    border-radius: 8px;
    font-size: 0.85rem;
    color: var(--text);
    display: flex;
    align-items: center;
    gap: 8px;
  }

  main {
    max-width: 1160px;
    margin: 0 auto;
  }

  #card-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 20px;
  }

  @media (max-width: 620px) {
    #card-grid {
      grid-template-columns: 1fr;
    }
  }

  .card {
    display: flex;
    flex-direction: column;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    overflow: hidden;
    text-decoration: none;
    color: var(--text);
    box-shadow: 0 1px 3px var(--shadow);
    transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease;
  }

  .card:hover {
    transform: translateY(-4px);
    box-shadow: 0 10px 24px var(--shadow);
    border-color: var(--accent);
    background: var(--surface-hover);
  }

  .card-thumb {
    width: 100%;
    aspect-ratio: 1200 / 630;
    background: var(--chip-bg);
    overflow: hidden;
  }

  .card-thumb img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    transition: transform 0.25s ease;
  }

  .card:hover .card-thumb img {
    transform: scale(1.04);
  }

  .card-body {
    padding: 16px 18px 18px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    flex: 1;
  }

  .card-title {
    font-size: 1.05rem;
    font-weight: 600;
    line-height: 1.3;
  }

  .card-desc {
    font-size: 0.87rem;
    color: var(--text-dim);
    line-height: 1.5;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .card-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }

  .tag {
    font-size: 0.72rem;
    padding: 3px 9px;
    background: var(--chip-bg);
    color: var(--text-dim);
    border-radius: 999px;
  }

  .card-footer {
    margin-top: auto;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 0.76rem;
    color: var(--text-dim);
    padding-top: 6px;
    border-top: 1px solid var(--border);
  }

  .status-dot {
    display: inline-block;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #4caf7d;
    margin-right: 5px;
  }
</style>
</head>
<body>

<header>
  <h1>📰 저장소 카드 뉴스</h1>
  <p>최근 푸시된 상위 5개 저장소를 카드로 살펴보고, 클릭해서 배포 페이지로 이동하세요.</p>
</header>

<div class="mock-banner" id="mock-banner">
  ⚠️ /api/repos 호출에 실패하면 가상 데이터로 대체 표시됩니다 (로컬에서 파일을 직접 열었을 때 등).
</div>

<main>
  <div id="card-grid"></div>
</main>

<script>
  // /api/repos 호출 실패 시 대체 표시용. 실제 서비스 대상 5개 저장소와 동일한 내용을 담아둔다.
  const mockRepos = [
    {
      owner: "kokim80-maker",
      name: "airport",
      description: "인천공항 입출국장 혼잡도를 조회하고 자주 보는 시간대를 즐겨찾기로 저장하는 대시보드",
      homepage: "https://airport-teal-two.vercel.app",
      html_url: "https://github.com/kokim80-maker/airport",
      pushedAt: "2026-07-24T05:55:13Z",
      topics: []
    },
    {
      owner: "kokim80-maker",
      name: "recipe",
      description: "냉장고 사진으로 식재료를 인식해 만들 수 있는 레시피를 추천하고 저장하는 웹 앱",
      homepage: "https://recipe-ten-roan.vercel.app",
      html_url: "https://github.com/kokim80-maker/recipe",
      pushedAt: "2026-07-28T08:03:18Z",
      topics: []
    },
    {
      owner: "kokim80-maker",
      name: "econo",
      description: "정보 부족",
      homepage: "https://econo-teal.vercel.app",
      html_url: "https://github.com/kokim80-maker/econo",
      pushedAt: "2026-07-05T16:53:48Z",
      topics: []
    },
    {
      owner: "kokim80-maker",
      name: "order",
      description: "디저트 가게 메뉴를 담아 주문하고 본인 주문 내역을 조회하는 서비스",
      homepage: "https://order-red-chi.vercel.app",
      html_url: "https://github.com/kokim80-maker/order",
      pushedAt: "2026-07-22T07:28:13Z",
      topics: []
    },
    {
      owner: "kokim80-maker",
      name: "alram",
      description: "간단한 알람",
      homepage: "https://alram-ruddy.vercel.app",
      html_url: "https://github.com/kokim80-maker/alram",
      pushedAt: "2026-07-24T08:17:14Z",
      topics: []
    }
  ];

  // 저장소명 기준 카드 제목/썸네일 오버라이드. 없으면 저장소명 + GitHub OpenGraph 이미지 사용
  const DISPLAY_OVERRIDES = {
    airport: { title: "인천공항 혼잡도 대시보드", image: "images/airport.png" },
    order: { title: "오늘의주문", image: "images/order.png" },
    recipe: { title: "냉장고 재료 인식", image: "images/recipe.png" },
    econo: { title: "한입경제", image: "images/econo.png" },
    alram: { title: "알람", image: "images/alram.png" },
  };

  function timeAgo(isoDate) {
    const diffMs = Date.now() - new Date(isoDate).getTime();
    const days = Math.floor(diffMs / (1000 * 60 * 60 * 24));
    if (days <= 0) return "오늘";
    if (days < 30) return `${days}일 전`;
    const months = Math.floor(days / 30);
    if (months < 12) return `${months}개월 전`;
    return `${Math.floor(months / 12)}년 전`;
  }

  function renderCards(repos) {
    const grid = document.getElementById("card-grid");
    grid.innerHTML = "";

    repos.slice(0, 5).forEach((repo) => {
      const link = repo.homepage && repo.homepage.trim() !== "" ? repo.homepage : repo.html_url;
      const override = DISPLAY_OVERRIDES[repo.name.toLowerCase()];
      const thumbUrl = override && override.image ? override.image : `https://opengraph.githubassets.com/1/${repo.owner}/${repo.name}`;
      const title = override && override.title ? override.title : repo.name;

      const card = document.createElement("a");
      card.className = "card";
      card.href = link;
      card.target = "_blank";
      card.rel = "noopener noreferrer";

      card.innerHTML = `
        <div class="card-thumb">
          <img src="${thumbUrl}" alt="${title} 썸네일" loading="lazy">
        </div>
        <div class="card-body">
          <div class="card-title">${title}</div>
          <div class="card-desc">${repo.description || "정보 부족"}</div>
          <div class="card-tags">
            ${repo.topics.map((t) => `<span class="tag">${t}</span>`).join("")}
          </div>
          <div class="card-footer">
            <span><span class="status-dot"></span>${repo.owner}</span>
            <span>${timeAgo(repo.pushedAt)} 업데이트</span>
          </div>
        </div>
      `;

      grid.appendChild(card);
    });
  }

  async function loadRepos() {
    try {
      const res = await fetch("/api/repos");
      if (!res.ok) throw new Error(`API 응답 오류: ${res.status}`);
      const data = await res.json();
      const repos = data.repos;
      if (!Array.isArray(repos) || repos.length === 0) throw new Error("빈 응답");
      renderCards(repos);
      const banner = document.getElementById("mock-banner");
      if (banner) banner.style.display = "none";
      if (Array.isArray(data.failed) && data.failed.length > 0) {
        console.warn("일부 저장소 조회 실패:", data.failed);
      }
    } catch (err) {
      console.warn("실제 데이터를 불러오지 못해 가상 데이터로 표시합니다.", err);
      renderCards(mockRepos);
    }
  }

  loadRepos();
</script>

</body>
</html>
